apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-learning
  region: ap-south-1
  version: "1.35"
  tags:
    Environment: dev
    team: backend
    Project: ecommerce
    CostCenter: engineering
    Owner: rohan
    Schedule: office-hours

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: workers
    instanceType: t3a.medium
    desiredCapacity: 2
    minSize: 0
    maxSize: 3
    volumeSize: 20
    privateNetworking: false
    tags:
      Name: eks-learning-worker
    iam:
      withAddonPolicies:
        ebs: true
        albIngress: true
        cloudWatch: true
